<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJ Test</title>
        <!-- Chessboard CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'chess_game/js/board/css/chessboard-1.0.0.min.css' %}">
</head>
<body>
    
    TJ Test
    <p id="demo">A Paragraph.</p>
    <script src="{% static 'chess_game/js/myScript.js' %}"></script>
    <button type="button" onclick="myFunction()">Try it</button>
    
    <!-- chess testing DMZ -->
    <!-- jQuery (required by chessboard.js) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- chess.js (move validation) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>


    <!-- Chessboard JS -->
    <script src="{% static 'chess_game/js/board/js/chessboard-1.0.0.js' %}"></script>

    <!-- Board div -->
    <div id="board1" style="width: 400px"></div>
    <button id="startBtn">Start Position</button>
    <button id="clearBtn">Clear Board</button>
    <button id="get_move">Get Move</button>

    <!-- FEN output section -->
    <p id="fen-output"></p>

    <!-- Init -->
    <script>
        var game = new Chess()
      
        function onDrop(source, target) {
          var move = game.move({
            from: source,
            to: target,
            promotion: 'q'
          })
      
          if (move === null) return 'snapback'
      
          
        }
      
        function onSnapEnd() {
          const fen = game.fen();
          board1.position(fen);
          document.getElementById("fen-output").textContent = fen;
          callChessApi(fen);
      }

        var board1 = Chessboard('board1', {
          position: 'start',
          draggable: true,
          pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
          onDrop: onDrop,
          onSnapEnd: onSnapEnd
        })
      
        async function sanitizeFen(fen) {
          fen = String(fen)
          const parts = fen.split(" ");
          parts[3] = "-";  // zero out en passant square
          return parts.join(" ");
      }
      
      async function callChessApi(fen) {
          fen = await sanitizeFen(fen);
          console.log(`Sending FEN: ${fen}`);
      
          const response = await fetch("https://chess-api.com/v1", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ fen })
          });
      
          if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
      
          const data = await response.json();
          console.log(`Best move: ${data.move} | Eval: ${data.eval}`);
          
          // Apply the move to chess.js
          game.move({ from: data.from, to: data.to, promotion: 'q' })

         // Sync the board
         board1.position(game.fen());

         // Fun idea call API at this point to play against itself.
        setTimeout(() => {
        callChessApi(game.fen());
         }, 400); // slight delay feels more natural -->

          return data;
      }

        $('#startBtn').on('click', board1.start)
        $('#clearBtn').on('click', board1.clear)
    </script>
    
</body>
</html>
