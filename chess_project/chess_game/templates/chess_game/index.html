<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJ Test</title>
        <!-- Chessboard CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'chess_game/js/board/css/chessboard-1.0.0.min.css' %}">
</head>
<body>
    
    <!-- testing below simple JS from static  -->
    <!-- <p id="demo">A Paragraph.</p> -->
    <!-- <script src="{% static 'chess_game/js/myScript.js' %}"></script> -->
    <!-- <button type="button" onclick="myFunction()">Try it</button> -->
    
    <!-- chess testing DMZ -->
    <!-- jQuery (required by chessboard.js) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- chess.js (move validation) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>


    <!-- Chessboard JS -->
    <script src="{% static 'chess_game/js/board/js/chessboard-1.0.0.js' %}"></script>

    <!-- Board div -->
    <div id="board1" style="width: 400px"></div>
    <button id="startBtn">Start Position</button>
    <button id="clearBtn">Clear Board</button>
    <input type="checkbox" id="selfplay" name="selfplay" value="selfplay">
    <label class="chk-box-label">Self-Play</label><br>
    <div id="difficulty-btns">
        <button class="diff-btn active" data-level="novice">Novice <small>800</small></button>
        <button class="diff-btn" data-level="apprentice">Apprentice <small>1000</small></button>
        <button class="diff-btn" data-level="clubplayer">Club Player <small>1200</small></button>
        <button class="diff-btn" data-level="contender">Contender <small>1400</small></button>
        <button class="diff-btn" data-level="rival">Rival <small>1600</small></button>
        <button class="diff-btn" data-level="expert">Expert <small>1800</small></button>
        <button class="diff-btn" data-level="master">Master <small>2000</small></button>
        <button class="diff-btn" data-level="grandmaster">Grandmaster <small>2200</small></button>
        <button class="diff-btn" data-level="deepblue">Deep Blue <small>2800</small></button>
        <button class="diff-btn" data-level="stockfish">Stockfish <small>MAX</small></button>
    </div>

    <!-- FEN output section -->
    <p id="fen-output"></p>

    <!-- Init -->
    <script>
      var game = new Chess()
  
      var currentDifficulty = "novice"; // default

      $('.diff-btn').on('click', function() {
          $('.diff-btn').removeClass('active');
          $(this).addClass('active');
          currentDifficulty = $(this).data('level');
      });

      function onDrop(source, target) {
          var move = game.move({
              from: source,
              to: target,
              promotion: 'q'
          })
  
          if (move === null) return 'snapback'
      }
  
      async function onSnapEnd() {
          //console.log('in onSnapEnd')
          const fen = game.fen();
          board1.position(fen);
          document.getElementById("fen-output").textContent = fen;
  
          if (game.game_over()) {
              document.getElementById("status").textContent = "Game over!";
              return;
          }
  
          const bestMove = await getBestMove(fen);
          if (bestMove) {
              game.move(bestMove, { sloppy: true });
              board1.position(game.fen());
              document.getElementById("fen-output").textContent = game.fen();
          }
         // 0529-2026 Self-Play option
         if (document.getElementById('selfplay').checked){
          onSnapEnd()
         }
          
      }
  
      var board1 = Chessboard('board1', {
          position: 'start',
          draggable: true,
          pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
          onDrop: onDrop,
          onSnapEnd: onSnapEnd
      })
  
      async function sanitizeFen(fen) {
          fen = String(fen)
          const parts = fen.split(" ");
          parts[3] = "-";
          return parts.join(" ");
      }
  
      async function getBestMove(fen) {
          fen = await sanitizeFen(fen);
          const response = await fetch("/best-move/", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json",
                  "X-CSRFToken": document.cookie.split("; ").find(r => r.startsWith("csrftoken="))?.split("=")[1]
              },
              body: JSON.stringify({ fen, difficulty: currentDifficulty }) //user selects difficult
          });
          console.log(`difficulty is ${currentDifficulty}`)
          const data = await response.json();
          console.log(`move is ${data.best_move}`)
          return data.best_move; // ✅ fixed
      }
  
      $('#startBtn').on('click', board1.start)
      $('#clearBtn').on('click', board1.clear)
  </script>
    
</body>
</html>
